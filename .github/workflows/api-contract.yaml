name: API contract

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  api-contract:
    name: API coverage and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install API test dependencies using application pins
        run: |
          node scripts/check-api.mjs --requirements > "${RUNNER_TEMP}/api-test-requirements.txt"
          python -m pip install -r "${RUNNER_TEMP}/api-test-requirements.txt"

      - name: Install frontend dependencies
        run: npm ci --force

      - name: Verify API coverage, exports, permissions and portal
        run: npm run api:verify
